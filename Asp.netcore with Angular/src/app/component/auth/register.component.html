<div class="auth-card">
  <h2 class="mb-3 text-center">Create Account</h2>
  <p class="text-muted text-center mb-4">Sign up to start managing products</p>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label">Full Name</label>
      <input type="text" class="form-control" formControlName="fullName" placeholder="Jane Doe">
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" formControlName="email" placeholder="you@example.com">
      <div class="text-danger small" *ngIf="registerForm.controls.email.touched && registerForm.controls.email.invalid">
        A valid email is required.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" formControlName="password" placeholder="••••••••">
      <div class="text-danger small" *ngIf="registerForm.controls.password.touched && registerForm.controls.password.invalid">
        Password is required (min 6 characters).
      </div>
    </div>

    <div class="text-danger mb-3" *ngIf="errorMessage">{{ errorMessage }}</div>

    <button class="btn btn-success w-100" type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Signing up...' : 'Sign Up' }}
    </button>
  </form>

  <div class="text-center mt-3">
    <span class="text-muted">Already have an account?</span>
    <a routerLink="/login">Sign in</a>
  </div>
</div>
